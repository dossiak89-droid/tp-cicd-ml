apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files:
      - /etc/prometheus/alerts.yml
    scrape_configs:
      - job_name: tp-cicd-ml
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ["default"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: tp-cicd-ml
            action: keep
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
  alerts.yml: |
    groups:
      - name: tp-cicd-ml
        rules:
          - alert: PodsIndisponibles
            expr: sum(up{job="tp-cicd-ml"}) < 2
            for: 30s
            labels:
              severity: warning
            annotations:
              summary: "Moins de 2 pods tp-cicd-ml en ligne"
              description: "Au moins un pod ne repond plus sur /metrics (2 attendus)."
          - alert: TauxErreursEleve
            expr: sum(rate(app_requests_total{status=~"4..|5.."}[1m])) > 0.2
            for: 30s
            labels:
              severity: warning
            annotations:
              summary: "Taux d'erreurs HTTP eleve sur l'API"
              description: "Plus de 0,2 erreur par seconde (codes 4xx et 5xx)."